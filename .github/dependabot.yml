# Audit CI-03 : mises à jour proposées des actions GitHub (épinglées par SHA) et des dépendances Gradle, une fois par semaine.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
