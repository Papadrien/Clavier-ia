name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath | grep litertlm

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Determine build type
        id: variant
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      # Même mécanisme et mêmes secrets qu'AnimalTimer :
      #   ANDROID_KEYSTORE_BASE64 et ANDROID_KEY_PROPERTIES
      # Projet Android natif : key.properties à la racine, keystore dans app/
      # (storeFile=keystore.jks est résolu relativement au module app).
      - name: Setup Android signing
        if: steps.variant.outputs.variant == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks
            echo "$KEY_PROPERTIES" > key.properties
            echo "✅ Signing release (secrets)"
          else
            keytool -genkey -v -keystore app/keystore.jks -alias taipo-debug -keyalg RSA -keysize 2048 -validity 10000 -storepass taipo-debug-pwd -keypass taipo-debug-pwd -dname "CN=Taipo Debug, OU=Dev, O=Taipo, L=Paris, C=FR" 2>/dev/null
            printf 'storePassword=taipo-debug-pwd\nkeyPassword=taipo-debug-pwd\nkeyAlias=taipo-debug\nstoreFile=keystore.jks\n' > key.properties
            echo "✅ Signing debug stable (sans secrets)"
          fi

      - name: Build APK (${{ steps.variant.outputs.variant }})
        run: |
          if [ "${{ steps.variant.outputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ steps.variant.outputs.variant }}
          path: app/build/outputs/apk/*/*.apk
          if-no-files-found: error