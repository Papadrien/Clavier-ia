org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Cache de build Gradle (réutilise les sorties de tâches identiques).
org.gradle.caching=true
android.useAndroidX=true
# Lot 3.6 : décommenter pour charger le module macrobenchmark (Android Studio compris). Voir docs/performance.md.
# taipo.benchmark=true

# Revue de code : cache de configuration de Gradle (configuration réutilisée d'une compilation à l'autre). En mode « warn »,
# une tâche incompatible est signalée sans faire échouer la compilation.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Clé publique de licence Google Play (Play Console > Monétiser > Licences), pour vérifier la signature des achats du pack
# premium (premium/PurchaseVerifier.kt, docs/pass-premium.md). Pas un secret : elle est de toute façon dans l'APK.
taipo.
